name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make ffmpeg

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native shim & TypeScript (Linux)
        if: runner.os == 'Linux'
        run: pnpm run build

      - name: Build TypeScript & GUI (Windows)
        if: runner.os == 'Windows'
        run: |
          pnpm run build:ts
          pnpm run build:gui

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Run test suite (Linux)
        if: runner.os == 'Linux'
        run: pnpm run test
        env:
          ROM_PATH: ${{ secrets.ROM_PATH }}

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: node --import tsx/esm --test tests/*.test.ts
        env:
          ROM_PATH: ${{ secrets.ROM_PATH }}

      - name: Verify package tarball
        run: npm pack --dry-run

